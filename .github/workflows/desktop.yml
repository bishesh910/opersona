name: desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/desktop/**', '.github/workflows/desktop.yml']

jobs:
  build-macos:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure Python distutils (node-gyp on Python 3.12+)
        run: python3 -m pip install --user setuptools 2>/dev/null || python3 -m pip install --break-system-packages setuptools 2>/dev/null || pip3 install setuptools || true
      - name: Install deps (native rebuild for Electron)
        working-directory: apps/desktop
        env:
          SETUPTOOLS_USE_DISTUTILS: local
        run: npm ci || npm install
      - name: Build + package (unsigned dmg + zip, arm64)
        working-directory: apps/desktop
        run: |
          npm run dist:mac
          node -p "require('./package.json').version" > dist/VERSION
      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: opersona-desktop-macos
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/VERSION
          if-no-files-found: error
