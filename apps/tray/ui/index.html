<!doctype html>
<meta charset="utf-8">
<title>Pair opersona</title>
<style>
  body { margin:0; font:14px/1.5 -apple-system, system-ui, sans-serif; background:#14110e; color:#efe9df; padding:24px; }
  h1 { font-size:16px; margin:0 0 6px; }
  p { color:#a89f92; font-size:12.5px; margin:0 0 14px; }
  input { width:100%; box-sizing:border-box; padding:10px 12px; border-radius:10px; border:1px solid #3a342c; background:#1e1a15; color:#efe9df; font:13px ui-monospace, monospace; }
  button { margin-top:12px; width:100%; padding:10px; border-radius:10px; border:0; background:#e8b04b; color:#241d12; font-weight:600; font-size:13.5px; cursor:pointer; }
  button:disabled { opacity:.5 }
  .err { color:#ff8f7a; font-size:12px; min-height:16px; margin-top:8px; }
  a { color:#e8b04b; }
</style>
<h1>Pair this machine</h1>
<p>Open <a href="#" onclick="window.__TAURI__.core.invoke('open_site'); return false">opersona.me → Settings → Models</a>, press <b>Pair a machine</b>, and paste the token:</p>
<input id="tok" placeholder="obr_…" autofocus spellcheck="false" autocomplete="off">
<button id="go">Connect</button>
<div class="err" id="err"></div>
<script>
  const tok = document.getElementById('tok'), go = document.getElementById('go'), err = document.getElementById('err');
  async function submit() {
    const v = tok.value.trim();
    if (!v.startsWith('obr_')) { err.textContent = 'That does not look like a bridge token — it starts with obr_.'; return; }
    go.disabled = true; err.textContent = '';
    try { await window.__TAURI__.core.invoke('save_token', { token: v }); }
    catch (e) { err.textContent = String(e); go.disabled = false; }
  }
  go.addEventListener('click', submit);
  tok.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
</script>
