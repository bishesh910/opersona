[package]
name = "opersona-tray"
version = "0.1.0"
description = "opersona menu-bar app — your persona's face on this machine"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
dirs = "5"

[profile.release]
strip = true
lto = true
